<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Puzzle art: a sunny archery meadow, flat storybook style. Hand-drawn in
       code for the Lesson Lab guide.js puzzle. Colours spread across the whole
       frame so every piece has something in it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc6f2"/><stop offset=".65" stop-color="#c9ecff"/><stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff7c2"/><stop offset=".45" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fb8e8"/><stop offset="1" stop-color="#9fe0ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd16a"/><stop offset="1" stop-color="#4fa64a"/>
    </linearGradient>
    <g id="target">
      <rect x="-5" y="20" width="6" height="58" rx="2" fill="#8a5a33" transform="rotate(-14)"/>
      <rect x="-1" y="20" width="6" height="58" rx="2" fill="#7a4c2a" transform="rotate(14)"/>
      <circle r="34" fill="#e9d29a" stroke="#b98d4a" stroke-width="3"/>
      <circle r="29" fill="#fffdf6"/>
      <circle r="23" fill="#2c2f3a"/>
      <circle r="17" fill="#3b8fe0"/>
      <circle r="11" fill="#e8443a"/>
      <circle r="5.5" fill="#ffd23f"/>
    </g>
    <g id="arrow">
      <line x1="0" y1="0" x2="26" y2="-9" stroke="#6b4423" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22 -12 L31 -12 L27 -6 Z M24 -6 L32 -4 L26 -2 Z" fill="#ff7a59"/>
    </g>
    <g id="pine"><path d="M0 -38 L-13 0 L13 0 Z" /><path d="M0 -26 L-16 10 L16 10 Z"/><rect x="-2.5" y="8" width="5" height="9" fill="#6b4423"/></g>
    <g id="flower"><circle r="3.2" cx="0" cy="-3.5"/><circle r="3.2" cx="3.4" cy="0"/><circle r="3.2" cx="0" cy="3.5"/><circle r="3.2" cx="-3.4" cy="0"/><circle r="2.3" fill="#ffe14d"/></g>
  </defs>

  <!-- sky -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <circle cx="470" cy="78" r="70" fill="url(#sun)"/>
  <circle cx="470" cy="78" r="30" fill="#fff3a8"/>
  <!-- clouds -->
  <g fill="#ffffff">
    <g opacity=".95"><ellipse cx="110" cy="62" rx="44" ry="17"/><ellipse cx="140" cy="50" rx="30" ry="20"/><ellipse cx="85" cy="52" rx="22" ry="15"/></g>
    <g opacity=".9"><ellipse cx="300" cy="40" rx="36" ry="13"/><ellipse cx="322" cy="31" rx="22" ry="14"/></g>
    <g opacity=".85"><ellipse cx="560" cy="135" rx="30" ry="11"/><ellipse cx="578" cy="127" rx="18" ry="11"/></g>
  </g>
  <!-- birds -->
  <path d="M220 90 q7 -7 14 0 q7 -7 14 0 M250 108 q5 -5 10 0 q5 -5 10 0" fill="none" stroke="#3d5a80" stroke-width="2.2" stroke-linecap="round"/>

  <!-- far hills and forest -->
  <path d="M0 190 C80 140 150 150 230 175 C300 140 380 130 460 165 C520 150 570 155 600 170 L600 260 L0 260Z" fill="#9bc7e8"/>
  <path d="M0 215 C90 180 170 190 260 205 C340 178 430 180 520 200 C560 192 585 195 600 200 L600 270 L0 270Z" fill="#6fb38a"/>
  <g fill="#2f7a55">
    <use href="#pine" x="30" y="214"/><use href="#pine" x="58" y="208"/><use href="#pine" x="84" y="215"/>
    <use href="#pine" x="500" y="206"/><use href="#pine" x="528" y="210"/><use href="#pine" x="556" y="204"/><use href="#pine" x="584" y="212"/>
  </g>
  <g fill="#3f9466"><use href="#pine" x="44" y="226"/><use href="#pine" x="70" y="230"/><use href="#pine" x="542" y="224"/><use href="#pine" x="570" y="228"/></g>

  <!-- meadow -->
  <path d="M0 240 C120 222 230 232 320 240 C420 228 520 226 600 236 L600 400 L0 400Z" fill="url(#grass)"/>
  <!-- stream -->
  <path d="M380 236 C360 262 420 278 380 300 C340 322 360 350 300 372 C270 384 250 392 230 400 L300 400 C330 390 360 378 400 360 C450 336 420 312 456 292 C490 272 430 256 420 236Z" fill="url(#stream)"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M395 262 q8 -3 14 0"/><path d="M380 318 q9 -3 16 0"/><path d="M318 372 q9 -3 16 0"/>
  </g>
  <!-- little bridge -->
  <path d="M352 318 q42 -26 84 0" fill="none" stroke="#8a5a33" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#8a5a33" stroke-width="3"><path d="M366 309 v12"/><path d="M394 301 v14"/><path d="M422 309 v12"/></g>

  <!-- targets across the meadow -->
  <use href="#target" x="120" y="250" transform="scale(1)"/>
  <use href="#target" x="250" y="262"/>
  <g transform="translate(520 268) scale(.85)"><use href="#target"/></g>
  <!-- arrows in the targets -->
  <use href="#arrow" x="118" y="252" transform="rotate(0)"/>
  <g transform="translate(108 244) rotate(-8)"><use href="#arrow"/></g>
  <g transform="translate(248 262) rotate(4)"><use href="#arrow"/></g>
  <g transform="translate(262 254) rotate(-12)"><use href="#arrow"/></g>
  <g transform="translate(516 270) rotate(6) scale(.85)"><use href="#arrow"/></g>

  <!-- bow rack and quiver, foreground left -->
  <g transform="translate(60 330)">
    <rect x="-34" y="0" width="68" height="7" rx="3" fill="#8a5a33"/>
    <rect x="-30" y="7" width="6" height="40" fill="#7a4c2a"/><rect x="24" y="7" width="6" height="40" fill="#7a4c2a"/>
    <path d="M-18 -46 Q-2 -14 -18 18" fill="none" stroke="#b5462f" stroke-width="5" stroke-linecap="round"/>
    <line x1="-18" y1="-46" x2="-18" y2="18" stroke="#f3efe2" stroke-width="1.4"/>
    <path d="M6 -42 Q22 -10 6 22" fill="none" stroke="#3b6fb6" stroke-width="5" stroke-linecap="round"/>
    <line x1="6" y1="-42" x2="6" y2="22" stroke="#f3efe2" stroke-width="1.4"/>
  </g>
  <g transform="translate(150 352) rotate(-12)">
    <rect x="-9" y="-30" width="18" height="44" rx="6" fill="#c0703c"/>
    <rect x="-9" y="-18" width="18" height="5" fill="#8a4a24"/>
    <g stroke="#6b4423" stroke-width="2"><path d="M-4 -30 v-16"/><path d="M1 -30 v-20"/><path d="M5 -30 v-14"/></g>
    <g fill="#ff7a59"><path d="M-7 -46 l6 -6 l-1 8z"/><path d="M-2 -50 l6 -6 l-1 8z"/><path d="M2 -44 l6 -6 l-1 8z"/></g>
  </g>

  <!-- flowers scattered so the bottom pieces have colour too -->
  <g fill="#ff6fa5"><use href="#flower" x="210" y="330"/><use href="#flower" x="470" y="350"/><use href="#flower" x="560" y="318"/><use href="#flower" x="30" y="382"/></g>
  <g fill="#b78cff"><use href="#flower" x="250" y="368"/><use href="#flower" x="520" y="380"/><use href="#flower" x="180" y="300"/></g>
  <g fill="#ffffff"><use href="#flower" x="440" y="388"/><use href="#flower" x="100" y="300"/><use href="#flower" x="580" y="360"/></g>
  <g fill="none" stroke="#3e8e3f" stroke-width="2" stroke-linecap="round">
    <path d="M200 395 q4 -14 0 -22"/><path d="M206 395 q-2 -12 4 -20"/><path d="M490 396 q4 -12 0 -20"/><path d="M80 396 q3 -12 -1 -20"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
