<!DOCTYPE html>
<!--
  THE MONSTER MUSEUM — engine: museum3d · variant: gothic-monsters · version 1

  A walkable first-person gallery the student curates: four empty frames in
  facing pairs (old vampire / new vampire, first zombies / new zombies) and a
  curator's lectern at the end of the hall. Each exhibit takes a picture
  (museum archive, upload, or link) plus a placard written one step at a time,
  mostly with taps. Export: .docx with the pictures embedded, print/PDF, and
  plain text for Canvas. Save file (.json) carries the work between computers.

  CONTENT-SWAPPABLE: everything course-specific is window.MUSEUM below. The
  engine is ../assets/museum3d/museum3d.js + museum3d.css (Three.js r128 from
  ../assets/vendor). To make a new museum for another class, copy this file
  and rewrite window.MUSEUM: give it a NEW id (the save key), then exhibits.

  Field types: text · textarea (stem = "Start me off" button) · select (one
  tap) · tags (min/max taps) · suggest: [...] adds one-tap answers to a text
  field. placard: [fieldIds] is what shows on the 3D placard; the first one
  is the placard's headline. starter pre-makes the first move.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ll-format" content="one-page">
<title>The Monster Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/museum3d/museum3d.css">
</head>
<body>
<div id="museum"></div>

<script type="application/json" id="qsummary">
[
  { "title": "The Old Blood (a 19th-century vampire)",
    "questions": ["Hang a picture from the museum archive (Dracula, Carmilla).", "Which vampire is it?", "In one sentence: who is the vampire and what do they do?", "Which Gothic elements are in it? (tap 2 to 4)", "What fear of its own time does it show? (tap one)", "Why? One sentence."] },
  { "title": "The New Blood (a 21st-century vampire)",
    "questions": ["Hang a picture (upload or link) and say where it is from.", "Which vampire story?", "One sentence: who is the vampire and what do they do?", "Which Gothic elements survived? (tap 2 to 4)", "How is it different from the Old Blood? (tap 1 to 3)", "What stayed the same? One sentence.", "What fear of our time does it show? (tap one) + why, one sentence."] },
  { "title": "The First Dead (Night of the Living Dead, 1968)",
    "questions": ["Hang a picture from the archive.", "One sentence: what are the zombies, and what do they do to the people in the house?", "Which Gothic elements are in it? (tap 2 to 4)", "What were people afraid of in 1968? (tap one) + why, one sentence."] },
  { "title": "The New Dead (a 21st-century zombie story)",
    "questions": ["Hang a picture (upload or link) and say where it is from.", "Which zombie story?", "One sentence: what happens?", "How are these zombies different from 1968? (tap 1 to 3)", "What fear of our time does it show? (tap one) + why, one sentence."] },
  { "title": "The Curator's Statement",
    "questions": ["Name your museum.", "Gothic survivors: which 3 elements appear in all four exhibits?", "Why did they survive 200 years?", "Old blood vs. new blood: how did the vampire change, and what does that say about us?", "Zombies are a mirror: what do zombie stories show about what a society fears? Use one exhibit."] }
]
</script>

<script>

  'fear of outsiders', 'a helpless victim', 'the past coming back', "a mind you can't trust", 'a group trapped together'];

window.MUSEUM = {
  id: 'gothic-monsters-v1',
  title: 'The Monster Museum',

  exportTitle: 'The Monster Museum',

        { id: 'changes', short: 'What changed since 1968', placardLabel: 'What changed', label: 'How are these zombies DIFFERENT from 1968? Tap 1 to 3.', type: 'tags', min: 1, max: 3,
