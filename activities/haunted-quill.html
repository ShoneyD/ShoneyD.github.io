<title>The Haunted Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a five-step workbench (Choose a door, Learn the sound, Build, Label, Answer & copy); one task visible at a time. Gothic palette, dark in every mode. */
:root{
  --paper:#0d0b10; --card:#17131b; --ink:#f1e8d8; --muted:#bcb09c; --line:#3b3139;
  --brand:#d4ad62; --brand-ink:#1a1206; --brand-soft:#2e2517;
  --accent:#c0392b; --accent-soft:#3a1418; --accent-ink:#f4a59a;
  --ok:#8fd19e; --ok-soft:#163222; --warn:#f0a070; --warn-soft:#3b2518;
  --hl-slant:#6a3a1a; --on-accent:#ffffff;
  --hl-allit:#5e4a12; --hl-asson:#1d3f5c; --hl-cons:#43296a; --hl-rhyme:#1f4d33; --hl-ono:#6e2228;
  --display:"Cinzel", "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --fs:17px; --lh:1.6; color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;}}
:root[data-theme="dark"]{color-scheme:dark;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:var(--lh)}
body.big{--fs:19px} body.roomy{--lh:1.9; letter-spacing:.02em; word-spacing:.08em}
*{box-sizing:border-box}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.65em;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand .meter-mark{font-family:var(--mono);color:var(--accent);font-size:.95em;letter-spacing:.12em}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{font:inherit;font-size:.85em;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}
nav.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:16px}
nav.steps button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:0}
nav.steps button .n{font-family:var(--mono);font-size:.8em;display:block}
nav.steps button .t{font-weight:700;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.steps button[aria-current="step"]{border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
nav.steps button.done .n::after{content:" ✓";color:var(--ok)}
@media (max-width:560px){nav.steps button .t{font-size:.85em}}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.word:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-family:var(--display);font-weight:800;font-size:1.35em;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.08em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.done-looks{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:.95em}
.done-looks b{color:var(--accent-ink)}
.label{font-size:.75em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
/* Spin */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--paper)}
.slot .val{font-family:var(--display);font-weight:800;font-size:1.3em;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.slot.rolling .val{color:var(--muted)}
.slot select{font:inherit;font-size:.9em;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.slot .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lock{font:inherit;font-size:.8em;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:3px 9px;cursor:pointer}
.lock[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{font:inherit;font-weight:700;border:none;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:10px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.big{font-size:1.1em;padding:12px 26px}
.hint{color:var(--muted);font-size:.9em}
/* Learn */
.learn{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:800px){.learn{grid-template-columns:minmax(0,1fr)}}
.devcard{border-left:4px solid var(--accent);padding-left:14px}
.def{font-size:1.1em;margin:4px 0 10px}
.examples{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.ex{background:var(--paper);border-radius:10px;padding:10px 12px}
.ex .say{font-family:var(--display);font-weight:600;font-size:1.12em}
.ex .why{color:var(--muted);font-size:.9em}
.hl{border-radius:4px;padding:0 2px}
.hl-allit{background:var(--hl-allit)} .hl-slant{background:var(--hl-slant)} .hl-asson{background:var(--hl-asson)} .hl-cons{background:var(--hl-cons)} .hl-rhyme{background:var(--hl-rhyme)} .hl-ono{background:var(--hl-ono)}
.starter{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.starter span{min-width:0}
.formlines{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.formlines li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:baseline}
.formlines .tag{font-family:var(--mono);font-size:.8em;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;text-align:center;padding:1px 4px}
.scan{display:flex;flex-wrap:wrap;gap:4px 10px;margin:8px 0}
.scan .w{display:flex;flex-direction:column;align-items:center}
.scan .marks{display:flex;gap:2px}
.mk{font-family:var(--mono);font-size:.95em;min-width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;padding:0}
.mk.s{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mk.guess{border-style:dashed}
.scan .wl{font-size:.85em;color:var(--muted)}
/* Write */
.write{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.write{grid-template-columns:minmax(0,1fr)}}
.prompt-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:.82em;border-radius:999px;padding:3px 10px;background:var(--brand-soft);color:var(--ink)}
.pill.twist{background:var(--accent-soft)}
textarea#pad{width:100%;min-height:15em;font-family:var(--body);font-size:1.12em;line-height:1.7;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);color:var(--ink);resize:vertical}
input[type=text],select.fld{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.bank{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.banktabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.banktabs button{font:inherit;font-size:.82em;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer}
.banktabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{font:inherit;font-size:.95em;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.word small{font-family:var(--mono);color:var(--muted);margin-left:4px;font-size:.75em}
.checker{margin-top:14px;overflow-x:auto}
table.lines{border-collapse:collapse;width:100%;font-size:.92em}
table.lines th{font-size:.72em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.lines td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt.ok{color:var(--ok);font-weight:600} .cnt.off{color:var(--warn);font-weight:600}
.scheme{font-family:var(--mono);font-weight:600;color:var(--brand)}
.dtag{display:inline-block;font-size:.78em;border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;color:var(--ink)}
.dtag.allit{background:var(--hl-allit)} .dtag.slant{background:var(--hl-slant)} .dtag.asson{background:var(--hl-asson)} .dtag.cons{background:var(--hl-cons)} .dtag.rhyme{background:var(--hl-rhyme)} .dtag.ono{background:var(--hl-ono)} .dtag.rep{background:var(--brand-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;font-size:.82em;color:var(--muted)}
.notice{font-size:.85em;color:var(--muted);margin-top:8px}
details.meterbox{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.meterbox summary{cursor:pointer;font-weight:700}
.mline{padding:8px 0;border-bottom:1px solid var(--line)}
.mline:last-child{border-bottom:none}
.fit{font-size:.88em;color:var(--muted)}
.fit b{color:var(--ink)}
/* Label & copy */
.labelgrid{display:grid;gap:12px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:8px;align-items:end;background:var(--paper);border-radius:10px;padding:10px}
@media (max-width:720px){.lrow{grid-template-columns:minmax(0,1fr)}}
.lrow label{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:var(--muted);min-width:0}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;gap:8px;align-items:baseline}
.checklist .box{font-family:var(--mono);width:1.4em;flex:none;text-align:center;border-radius:5px}
.checklist li.yes .box{color:var(--ok);background:var(--ok-soft)}
.checklist li.no .box{color:var(--warn);background:var(--warn-soft)}
pre#out{white-space:pre-wrap;word-break:break-word;font-family:var(--body);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;max-height:26em;overflow:auto}
.copied{color:var(--ok);font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:800px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.hl-meter{border:1px solid var(--ink);color:var(--ink)}
.hl-rep{background:var(--brand-soft);box-shadow:inset 0 -2px 0 var(--brand)}
.tw{text-decoration:underline wavy var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.expoem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.extitle{font-family:var(--display);font-weight:600;font-size:.95em;color:var(--muted);margin:4px 0 8px}
.exbody{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:10px;padding:10px 6px;overflow-x:auto}
.exline{display:grid;grid-template-columns:2em minmax(0,1fr) 1.4em;gap:8px;align-items:center;min-height:1.9em}
.exl{font-family:var(--mono);font-size:.78em;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.exl .acro{font-family:var(--display);font-size:1.3em;color:var(--accent-ink)}
.exr{font-family:var(--mono);font-weight:600;color:var(--brand);font-size:.85em}
.extext{font-family:var(--display);font-weight:600;font-size:1.08em;line-height:1.5;white-space:nowrap}
.extext.beat{display:inline-flex;align-items:flex-end;gap:0 .3em}
.bw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2}
.bm{display:flex;gap:.3em;font-family:var(--mono);font-style:normal;font-size:.72em;font-weight:700;color:var(--muted);height:1.3em;align-items:flex-end}
.exb{min-width:0;overflow:hidden}
.bm i{font-style:normal}
.bm i.s{color:var(--accent-ink)}
.bt{white-space:nowrap}
.exline.hasbeat{min-height:2.6em}
.exline.refrain .exb{box-shadow:inset 3px 0 0 var(--accent);padding-left:6px}
.exbtns{display:flex;gap:6px;flex-wrap:wrap}
.beatbtn{font:inherit;font-size:.85em;font-weight:700;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 12px;cursor:pointer}
.beatbtn[aria-pressed="false"]{background:var(--accent-soft);color:var(--accent-ink)}
.beatbtn span{font-family:var(--mono);margin-right:2px}
section .expoem{margin-top:16px}
.otherdev{margin-top:14px}
.exscan .scan{margin:2px 0}
.exscan .mk,.ex .mk{cursor:default}
.exkey{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px;font-size:.82em}
.exnotes{margin:6px 0 0;padding-left:1.1em;font-size:.9em;display:flex;flex-direction:column;gap:3px}

/* ===== Gothic layer ===== */
body{background:radial-gradient(ellipse at 50% -10%, #2a1a22 0%, var(--paper) 55%) fixed, var(--paper)}
.brand h1{font-family:var(--display);font-weight:800;letter-spacing:.04em;color:var(--brand)}
.brand .meter-mark{color:var(--accent-ink)}
h2,h3{font-family:var(--display);letter-spacing:.02em}
h2{color:var(--brand)}
.panel{box-shadow:0 0 0 1px #000 inset, 0 18px 40px -24px #000}
nav.steps{grid-template-columns:repeat(5,minmax(0,1fr))}
.slot .val,.ex .say,.extext{font-family:var(--body)}
.extext{font-weight:700}
.firstmove{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:1.02em}
.fig{margin:0 0 12px}
.imgbox{position:relative;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.imgbox img{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.15) contrast(1.05)}
.imgfb{display:none}
.noimg .imgbox{min-height:140px;display:flex;align-items:center;justify-content:center}

.fig figcaption{font-size:.78em;color:var(--muted);margin-top:4px;line-height:1.35}

.banner .imgbox{height:220px}
.banner .imgbox img{object-position:center 35%}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}

.doorbody{padding:8px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}

details.more{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}

.inspire{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:760px){.inspire{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.inspire{grid-template-columns:minmax(0,1fr)}}
.ins .imgbox{height:170px}
.seed{font-weight:700;margin:2px 0 0}
.stanzas{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.stanza{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
.sthead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.sticon{font-size:1.6em;line-height:1}
.sthead h3{margin:0}
.ask{margin:2px 0 0;color:var(--accent-ink);font-weight:700}
.bline{display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.bline:first-of-type{border-top:none}

.bmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.binput{font:inherit;font-size:1.05em;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink)}

.bopts{display:flex;flex-direction:column;gap:5px}

.bchip:hover{border-color:var(--brand)}
.bchip[aria-pressed="true"]{border-style:solid;border-color:var(--brand);background:var(--brand-soft)}
.mine{font-size:.82em;color:var(--brand);font-weight:700}
.yours{font-size:1.02em;margin:0 0 12px}
.stars{color:var(--brand);letter-spacing:.12em;font-size:1.1em}
.answer{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:16px;align-items:start}
@media (max-width:820px){.answer{grid-template-columns:minmax(0,1fr)}}
.poemside{position:sticky;top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pl{margin:6px 0 0;padding-left:2em;display:flex;flex-direction:column;gap:3px}
.pl li::marker{font-family:var(--mono);color:var(--muted);font-size:.8em}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.qcard h3{font-size:1em;line-height:1.4;margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.95em;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.elems{display:flex;flex-direction:column;gap:6px}
.elem{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.elem select{width:auto;max-width:100%;flex:1 1 220px}
.rbox{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink);resize:vertical}
.msvg{width:100%;max-width:360px;color:var(--ink)}
.turnin{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.tapone{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.bchip{font-size:.95em;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.bchip .plus{color:var(--brand);font-weight:700}
.bchip:hover,.bchip[aria-pressed="true"]{color:var(--ink)}

function startKey(w){

  const rules=[[/^ph/,"f"],[/^kn/,"n"],[/^wr/,"r"],[/^gn/,"n"],[/^wh/,"w"],[/^qu/,"k"],[/^c[eiy]/,"s"],[/^ch/,"ch"],[/^sh/,"sh"],[/^th/,"th"],[/^c/,"k"]];

/* vowel sound classes */
const EASHORT=new Set("bread head dead spread thread breath sweat dread instead meant deaf health wealth tread lead".split(" "));
const IRR={there:"AIR|",where:"AIR|",were:"ER|",heart:"AR|t",through:"OO|",two:"OO|",too:"OO|",move:"OO|v",prove:"OO|v",done:"u|n",won:"u|n",one:"u|n",none:"u|n",some:"u|m",come:"u|m",love:"u|v",above:"u|v",dove:"u|v",glove:"u|v",steak:"AY|k",break:"AY|k",great:"AY|t",sign:"EYE|n",design:"EYE|n",do:"OO|",to:"OO|",who:"OO|",you:"OO|",shoe:"OO|",give:"i|v",live:"i|v",have:"a|v",said:"e|d",says:"e|z",friend:"e|nd",been:"i|n",heart:"AR|t",word:"ER|d",world:"ER|ld",work:"ER|k",eye:"EYE|",was:"u|z",what:"u|t",gone:"o|n",could:"oo|d",would:"oo|d",should:"oo|d",good:"oo|d",wood:"oo|d",stood:"oo|d",foot:"oo|t",book:"oo|k",look:"oo|k",cook:"oo|k",took:"oo|k",put:"oo|t",push:"oo|sh"};
const OWWORDS=new Set(["now","how","cow","wow","plow","brow","allow","vow","bow"]);
function clusterClass(v,coda,word){
  if(coda.startsWith("r")){
    if(v==="ea" && coda.length>1 && coda!=="rs") return "ER";
    if(/^(ea|ee)$/.test(v)) return "EER";
    if(/^(ai|a)$/.test(v)&&v==="ai") return "AIR";
    if(v==="a") return "AR";
    if(/^(o|oa|oo|ou)$/.test(v)) return "OR";
    if(/^(e|i|u|ea)$/.test(v)) return "ER";
  }
  const map={ee:"EE",ea:"EE",ie:"EE",ei:"AY",ai:"AY",ay:"AY",ey:"AY",oa:"OH",oe:"OH",ou:"OW",oo:"OO",ue:"OO",ew:"OO",ui:"OO",oi:"OY",oy:"OY",au:"AW",aw:"AW",
    a:"a",e:"e",i:"i",o:"o",u:"u",y:"i"};
  if(v==="ow") return (coda&&coda!=="s")?"OW":(OWWORDS.has(word.replace(/s$/,""))?"OW":"OH");
  if(map[v]) return map[v];
  if(v.length>2) return map[v.slice(-2)]||map[v[0]]||v;
  return map[v[0]]||v;
}
function normCoda(c){
  return c.replace(/mb$/,"m").replace(/ght$/,"t").replace(/ck/g,"k").replace(/c$/,"k").replace(/ph/g,"f").replace(/(.)\1/g,"$1");
}
const _RK=new Map();
function rhymeKey(raw){ if(_RK.has(raw)) return _RK.get(raw); const r=rhymeKey_(raw); _RK.set(raw,r); return r; }
function rhymeKey_(raw){
  const w=raw.toLowerCase().replace(/[^a-z]/g,"");
  if(!w) return "";
  { const ph=phones(w); if(ph){ const k=cmuRhyme(ph); if(k) return k; } }
  if(IRR[w]) return IRR[w];
  { const info=wordInfo(w); if(info.syl>=2 && info.stress[info.stress.length-1]===0){
    // feminine ending: rhyme runs from the last stressed vowel (ribbon ≠ saffron, water ≈ daughter)
    const k=info.stress.lastIndexOf(1); const cl=[...w.matchAll(/[aeiouy]+/g)];
    if(k>=0 && cl[k]){ const tail=w.slice(cl[k].index); return "F|"+tail.replace(/^[aeiouy]+/,v=>clusterClass(v,"",w)); }
  } }
  if(w.length>3 && /[^s]s$/.test(w) && !/(us|is|ss)$/.test(w) && LEX.has(w.slice(0,-1))) return rhymeKey(w.slice(0,-1))+"s";
  if(w.length>4 && /es$/.test(w) && LEX.has(w.slice(0,-2))) return rhymeKey(w.slice(0,-2))+"s";
  if(w.length>3 && /[aeiou][^aeiouyr]es$/.test(w) && !/(ss|sh|ch|x|z)es$/.test(w)) return rhymeKey(w.slice(0,-1))+"s";
  if(w.length>3 && /[aeiou][^aeiouyr]ed$/.test(w)) return rhymeKey(w.slice(0,-1))+"d";
  if(/[^aeiou]le$/.test(w) && w.length>3){ const k=rhymeKey(w.slice(0,-2)); return k+"l"; }
  let m;
  if((m=w.match(/igh(t?s?)$/))) return "EYE|"+(m[1]||"");
  if(/[^aeiou]y$/.test(w)) return (wordInfo(w).syl===1)?"EYE|":"EE|";
  if((m=w.match(/([aeiou])(r[^aeiouy]?)e$/)) && w.length>2){
    const rest=normCoda(m[2].replace(/^r+/,"")); const rc={a:"AIR",e:"EER",i:"EYE",o:"OR",u:"OOR"}[m[1]];
    return (m[1]==="i"?"EYE|r"+rest:rc+"|"+rest);
  }
  if((m=w.match(/([aeiou])([^aeiouy]{1,2})e$/)) && !/[^aeiou]le$/.test(w) && w.length>2){
    const longs={a:"AY",e:"EE",i:"EYE",o:"OH",u:"OO"};

function vowelKey(raw){
  const w=raw.toLowerCase().replace(/[^a-z]/g,"");
  { const ph=phones(w); if(ph){ const i=stressIdx(ph); if(i>=0) return vClass(ph,i); } }
  const info=wordInfo(w);
  if(info.syl===1) return rhymeKey(w).split("|")[0];
  const m=w.match(/([aeiouy]+)([^aeiouy]*)/);
  return m?clusterClass(m[1],m[2],w):"";

function consSounds(raw){
  let w=raw.toLowerCase().replace(/[^a-z]/g,"");
  { const ph=phones(w); if(ph){ const f=ph.findIndex(x=>x.s!==null); const out=new Set();
      ph.slice(f+1).forEach(x=>{ if(x.s===null&&!["W","Y","HH"].includes(x.p)) out.add(C_LABEL[x.p]); }); return out; } }
  w=w.replace(/ck/g,"k").replace(/c(?=[eiy])/g,"s").replace(/c/g,"k").replace(/ph/g,"f").replace(/gh/g,"").replace(/(.)\1/g,"$1").replace(/e$/,"");

/* ===================== POEM ANALYSIS ===================== */
function analyze(text){
  const raw=text.replace(/\r/g,"").split("\n");
  const lines=raw.map((l,i)=>({i,text:l,toks:tokens(l)})).filter(l=>l.toks.length);
  const keys={}; let next=0; const letters="ABCDEFGHIJKLMNOP";
  lines.forEach(l=>{
    const last=l.toks[l.toks.length-1];
    const k=rhymeKey(last); l.rk=k; l.last=last;
    l.syl=l.toks.reduce((s,t)=>s+wordInfo(t).syl,0);
    l.found=[];
    const content=l.toks.filter(isContent);
    // alliteration
    const sk={}; content.forEach(t=>{const k=startKey(t);(sk[k]=sk[k]||[]).push(t);});
    Object.entries(sk).forEach(([k,ws])=>{ if(new Set(ws.map(x=>x.toLowerCase())).size>=2) l.found.push({dev:"alliteration",cls:"allit",label:"Alliteration",words:ws,note:`“${k}” sound`}); });
    // assonance
    const vk={}; content.forEach(t=>{const k=vowelKey(t); if(k)(vk[k]=vk[k]||[]).push(t);});
    Object.entries(vk).forEach(([k,ws])=>{ const uniq=[...new Set(ws.map(x=>x.toLowerCase()))]; if(uniq.length>=3) l.found.push({dev:"assonance",cls:"asson",label:"Assonance?",words:ws,note:`repeated vowel (${k})`}); });
    // consonance
    const ck={}; content.forEach(t=>{consSounds(t).forEach(c=>{(ck[c]=ck[c]||new Set()).add(t.toLowerCase());});});
    const best=Object.entries(ck).filter(([c,s])=>s.size>=3).sort((a,b)=>b[1].size-a[1].size)[0];
    if(best) l.found.push({dev:"consonance",cls:"cons",label:"Consonance?",words:[...best[1]],note:`“${best[0]}” inside/end of words`});
    // onomatopoeia
    const ono=l.toks.filter(t=>{const w=t.toLowerCase(); return SOUNDWORDS.has(w)||SOUNDWORDS.has(w.replace(/(es|s|ed|ing)$/,""))||SOUNDWORDS.has(w.replace(/(ed|ing)$/,"e"));});
    if(ono.length) l.found.push({dev:"onomatopoeia",cls:"ono",label:"Onomatopoeia",words:ono,note:"sound word"});
    // internal rhyme
    const rk={}; content.forEach(t=>{const k=rhymeKey(t); if(k.split("|")[0].length>1 || k.split("|")[1]) (rk[k]=rk[k]||new Set()).add(t.toLowerCase());});
    Object.values(rk).forEach(s=>{ if(s.size>=2) l.found.push({dev:"internalrhyme",cls:"rhyme",label:"Internal rhyme",words:[...s],note:"rhyme inside the line"}); });
  });
  // end-rhyme scheme
  lines.forEach((l,idx)=>{
    let letter=null;
    for(let j=0;j<idx;j++){ if(lines[j].rk===l.rk && lines[j].last.toLowerCase()!==l.last.toLowerCase() || (lines[j].rk===l.rk && false)){ letter=lines[j].letter; break; } }
    if(!letter){ for(let j=0;j<idx;j++){ if(lines[j].rk===l.rk){ letter=lines[j].letter; break; } } }
    if(!letter){ letter=letters[next++%letters.length]; }
    l.letter=letter;
  });
  lines.forEach((l,idx)=>{
    const partner=lines.find((o,j)=>j!==idx && o.letter===l.letter && o.last.toLowerCase()!==l.last.toLowerCase());
    if(partner) l.found.push({dev:"endrhyme",cls:"rhyme",label:"End rhyme",words:[l.last,partner.last],note:`rhymes with line ${lines.indexOf(partner)+1}`});
  });
  // slant rhyme between line endings (first partner only, so the checker stays readable)
  lines.forEach((l,idx)=>{
    const partner=lines.find((o,j)=>j!==idx && slantWords(l.last,o.last));
    if(partner) l.found.push({dev:"slantrhyme",cls:"slant",label:"Slant rhyme",words:[l.last,partner.last],note:`almost rhymes with line ${lines.indexOf(partner)+1}`});
  });
  // repetition: line starts + repeated content words
  const starts={}; lines.forEach(l=>{const n=(isContent(l.toks[0])||l.toks.length<2)?1:2; const s=l.toks.slice(0,n).join(" ").toLowerCase(); l.startN=n; (starts[s]=starts[s]||[]).push(l);});
  Object.entries(starts).forEach(([s,ls])=>{ if(ls.length>=2) ls.forEach(l=>l.found.push({dev:"repetition",cls:"rep",label:"Repetition",words:[l.toks.slice(0,l.startN).join(" ")],note:`${ls.length} lines start with “${s}”`})); });
  const counts={}; lines.forEach(l=>l.toks.filter(isContent).forEach(t=>{const w=t.toLowerCase(); counts[w]=(counts[w]||0)+1;}));
  Object.entries(counts).forEach(([w,n])=>{ if(n>=3) lines.forEach(l=>{ if(l.toks.some(t=>t.toLowerCase()===w) && !l.found.some(f=>f.dev==="repetition"&&f.words.map(x=>x.toLowerCase()).includes(w))) l.found.push({dev:"repetition",cls:"rep",label:"Repetition",words:[w],note:`“${w}” appears ${n} times`}); }); });
  return lines;
}

/* slant rhyme: endings that almost match — same vowel, different final consonant (tide/time),
   or same final consonant, different vowel (bell/ball). Plural -s alone doesn't count. */
function endSound(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");
  { const ph=phones(w); if(ph){ const i=stressIdx(ph); if(i>=0){ let j=ph.length; while(j>0&&ph[j-1].s===null) j--;
      return {v:vClass(ph,i),c:ph.slice(j).filter(x=>!(x.p==="R"&&j-1===i&&R_CLASS[ph[i].p])).map(x=>C_LABEL[x.p]).join("")}; } } }
  const k=rhymeKey(w);
  if(k.startsWith("F|")){ const m=k.slice(2).match(/^([A-Z]+|[a-z])/); const c=normCoda((w.match(/[^aeiouy]+$/)||[""])[0]); return {v:m?m[1]:"",c}; }
  const [v,c]=k.split("|"); return {v,c:c||""};
}
function slantWords(a,b){
  a=a.toLowerCase().replace(/[^a-z]/g,""); b=b.toLowerCase().replace(/[^a-z]/g,"");
  if(!a||!b||a===b||rhymeKey(a)===rhymeKey(b)) return false;
  if(rhymeKey(a).startsWith("F|")!==rhymeKey(b).startsWith("F|")) return false; /* stress must land in the same place */
  const x=endSound(a), y=endSound(b);
  const cx=x.c.replace(/[sz]$/,""), cy=y.c.replace(/[sz]$/,"");
  if(x.v===y.v && cx && cy && cx!==cy) return true;
  if(cx && cx===cy && x.v!==y.v) return true;
  return false;
}

/* meter */
const FEET={iambic:[0,1],trochaic:[1,0],anapestic:[0,0,1],dactylic:[1,0,0]};
const LENGTHS=["","monometer","dimeter","trimeter","tetrameter","pentameter","hexameter","heptameter","octameter"];
function meterFit(pattern){
  if(pattern.length<2) return null;
  let best=null;
  for(const [name,foot] of Object.entries(FEET)){
    let ok=0; pattern.forEach((p,i)=>{ if(p===foot[i%foot.length]) ok++; });
    const score=ok/pattern.length;
    if(!best||score>best.score) best={name,score,feet:Math.round(pattern.length/foot.length)};
  }
  best.label=`${best.name} ${LENGTHS[best.feet]||best.feet+" feet"}`;
  return best;
}

function scorePoem(lines){ return lines.reduce((s,m)=>s+(m.origin==="pool"?3:0),0)+Math.random(); }

/* Time-budgeted: stop once a poem is found and SOFT ms have passed, and always by HARD ms.
   (Unbudgeted, slant rhyme + refrain could block the page for 14 s on a slow laptop.) */
const EX_SOFT=180, EX_HARD=550;
function buildExample(themeKey,formKey,dev,twIdx,hard){
  const t0=performance.now(); const HARD=hard||EX_HARD;
  const ctx=ctxFor(themeKey); const tw=TWIST_KEYS[twIdx];
  if(formKey==="iam") return buildIAm(ctx,dev,tw);
  const specs=slotsFor(formKey,ctx); const n=specs.length;
  let basePairs=PAIRS[formKey]||[];
  if(dev==="endrhyme" && !basePairs.length) basePairs=[formKey==="haiku"?[0,2]:formKey==="cinquain"?[1,3]:[n-2,n-1]];
  const cands=specs.map(s=>candidatesFor(ctx,s,dev,tw));
  const canRefrain = formKey!=="acrostic" && tw!=="shortest" && (specs[0].syl===specs[n-1].syl);
  const found=[];
  for(let a=0; a<3000 && found.length<24; a++){
    if((a&15)===0){ const el=performance.now()-t0; if(el>HARD || (found.length && el>EX_SOFT)) break; }
    let pairs=(formKey==="meterq"&&a>1500)?[]:basePairs;
    if(dev==="endrhyme"&&["acrostic","list","free"].includes(formKey)){ const i=Math.floor(Math.random()*(n-1)); const j=(formKey!=="acrostic"&&Math.random()<0.3)?Math.min(n-1,i+2):i+1; pairs=[[i,j]]; }
    if(dev==="endrhyme"&&formKey==="cinquain") pairs=[rnd([[1,3],[0,4],[2,3],[1,2]])];
    if(dev==="endrhyme"&&formKey==="haiku") pairs=[rnd([[0,2],[0,1],[1,2]])];
    const refrain=canRefrain&&!pairs.some(p=>p[0]===0&&p[1]===n-1)&&(tw==="refrain"||(dev==="repetition"&&Math.random()<0.4));
    const slSlot=1+Math.floor(Math.random()*(n-1));
    const slantPair=(dev==="slantrhyme"&&pairs.length&&Math.random()<0.6)?pairs[pairs.length-1]:null;
    let againSlots=null;
    if(dev==="repetition"&&!refrain&&Math.random()<0.5){ if(pairs.length>1) againSlots=[pairs[0][0],pairs[1][0]]; else { const i=Math.floor(Math.random()*(n-1)); againSlots=[i,i+1]; } }
    const devSlot=Math.floor(Math.random()*n), twSlot=tw==="sound"?0:Math.floor(Math.random()*n);
    const lines=[]; let fail=false;
    for(let i=0;i<n;i++){
      if(refrain && i===n-1){ const pr=pairs.find(p=>p[1]===i); if(pr&&(lines[pr[0]].rk!==lines[0].rk||lines[pr[0]].lastL===lines[0].lastL)){ fail=true; break; } lines.push(lines[0]); continue; }
      let list=cands[i];
      if(againSlots&&againSlots.includes(i)&&!specs[i].letter){ const ag=againCands(ctx,specs[i]); if(ag.length) list=ag; }
      const usedSpecial=lines.some(l=>l.special||l.f.caps);
      list=list.filter(m=>allowed(m,i,n,tw)&&!lines.includes(m)&&!lines.some(l=>l.display.toLowerCase()===m.display.toLowerCase())&&!(usedSpecial&&(m.special||m.f.caps)));
      const pr=pairs.find(p=>p[1]===i);
      if(pr){
        const A=lines[pr[0]];
        if(pr===slantPair){ const sl=list.filter(m=>slantWords(A.last,m.last)); list=sl; if(!list.length){ fail=true; break; } lines.push(wpick(list)); continue; }
        let rl=list.filter(m=>m.rk===A.rk&&m.lastL!==A.lastL);
        if(!rl.length) rl=rhymeCands(ctx,specs[i],A).filter(m=>allowed(m,i,n,tw)&&!lines.includes(m));
        list=rl;
      } else {
        const fp=pairs.find(p=>p[0]===i);
        if(fp && fp===slantPair){ const j=fp[1]; const sub=list.filter(m=>cands[j].some(o=>slantWords(m.last,o.last))); if(sub.length) list=sub; }
        else if(fp && refrain && fp[1]===n-1){ list=list.filter(m=>m.rk===lines[0].rk&&m.lastL!==lines[0].lastL); }
        else if(fp && Math.random()<0.85){ const j=fp[1]; const sub=list.filter(m=>cands[j].some(o=>o!==m&&o.rk===m.rk&&o.lastL!==m.lastL)); if(sub.length) list=sub; }
      }
      if(dev==="slantrhyme" && i===slSlot){ const d=list.filter(m=>lines.some(a=>slantWords(a.last,m.last))); if(d.length) list=d; }
      if(i===devSlot && LINE_DEVICES.has(dev)){ const d=list.filter(m=>hasDevice(m,dev)); if(d.length) list=d; }
      if(i===twSlot && LINE_TWISTS.has(tw)){ const d=list.filter(m=>hasTwist(m,tw)); if(d.length) list=d; }
      if(tw==="shortest" && i===n-1 && lines.length){ const mn=Math.min(...lines.map(l=>l.words)); const d=list.filter(m=>m.words<mn); if(d.length) list=d; }
      if(!list.length){ fail=true; break; }
      lines.push(wpick(list));
    }
    if(fail) continue;
    if(formKey==="meterq" && !lines.every(m=>m.meterOK)) continue;
    if(!poemHasDevice(lines,dev) || !poemHasTwist(lines,tw)) continue;
    found.push({lines,pairs,slantPair,score:scorePoem(lines)});
  }
  if(!found.length) return null;
  found.sort((x,y)=>y.score-x.score);
  const best=found[0];
  return {lines:best.lines,pairs:best.pairs,slantPair:best.slantPair,specs,form:formKey,dev,tw,theme:themeKey};
}

/* I Am poems are built from their own frames: every line starts with the speaker, last line repeats the first.
   Lines 2-4 can borrow a hand-written pool line after a colon ("I hear: hiss, slap, and splash"). */
function buildIAm(ctx,dev,tw){
  const P=tw==="noI"?"You":"I", BE=P==="I"?"am":"are";
  const F={
    1:[`${P} ${BE} the {adj} {noun}`,`${P} ${BE} a {adj} {noun}`,`${P} ${BE} the {noun} of the {noun}`,`${P} ${BE} the {adj} {noun} of the {noun}`],
    2:[`${P} wonder about the {adj} {noun}`,`${P} wonder where the {nouns} go`,`${P} wonder what the {noun} knows`,`${P} wonder why the {noun} is {adj}`],
    3:[`${P} hear the {sound} of the {noun}`,`${P} hear {sound}, {sound}, {sound}`,`${P} hear the {adj} {noun}`],
    4:[`${P} see the {adj} {noun} and the {adj} {noun}`,`${P} see {adj} {nouns}`,`${P} see the {noun} {prep} the {noun}`],
    5:[`${P} want the {adj} {noun}`,`${P} want to be the {noun}`,`${P} want to {verb} like the {noun}`,`${P} want {adj} {nouns}`]
  };
  if(tw==="color"){ F[4]=[`${P} see the {color} {noun}`,`${P} see {color} {nouns}`]; }
  if(tw==="number"){ F[4]=[`${P} see {num} {nouns}`,`${P} see {num} {adj} {nouns}`]; }
  if(tw==="question"){ F[2]=[`${P} wonder: why is the {noun} so {adj}?`,`${P} wonder: where do the {nouns} go?`,`${P} wonder: what does the {noun} know?`]; }
  if(tw==="simile"){ F[5]=[`${P} want to {verb} like the {noun}`,`${P} want to be {adj} as a {noun}`]; }
  if(tw==="you"){ F[5]=[`{Noun}, ${P==="I"?"I":"we"} want to be like you`,`{Noun}, ${P==="I"?"I":"we"} want what you have`]; }
  if(tw==="sound"){ F[1]=[`${P} ${BE} the {sound} of the {noun}`]; }
  if(tw==="caps"){ F[3]=[`${P} hear the {SOUND} of the {noun}`,`${P} hear {SOUND}, {sound}, {sound}`]; }
  if(tw==="order"){ F[4]=[`Look! ${P} see the {adj} {noun}`,`Listen: ${P} hear the {noun} {prep} the {noun}`]; }
  if(tw==="senses"){ F[3]=[`${P} smell the {adj} {noun}`,`${P} taste the {noun}`,`${P} smell {noun} and {noun}`]; }
  if(tw==="bigword"){ F[1]=[`${P} ${BE} the {adj3} {noun}`,`${P} ${BE} the {noun3}`]; }
  const usable=ctx.pool.filter(m=>!m.stress&&!m.f.hasI&&!m.f.you&&m.words>=3&&/^[a-z]/.test(m.display)&&!m.display.includes(":")&&(tw==="question"||!m.f.q));
  const colon=(verb,m)=>cached(ctx,"col|"+P+verb+"|"+m.display,()=>meta(`${P} ${verb}: ${m.display}`,"pool",null,ctx));
  const meterLine=()=>{ const T=rnd(METER_T.filter(m=>m.name==="iambic"&&m.syl===8&&m.t.startsWith("a ")&&!m.tw)); const r=fillTpl(ctx,T.t,{}); if(!r) return null;
    return meta(fixText(`${P} hear ${r.text}`),"gen",[0,1].concat(r.stress),ctx); };
  const mk=(n,c)=>{ const r=fillTpl(ctx,rnd(F[n]),c||{}); return r?meta(fixText(r.text),"gen",null,ctx):null; };
  const lineFor=(n,devLine)=>{
    const opts=[];
    for(let k=0;k<6;k++){ const m=mk(n,devLine?deviceConstraint(ctx,dev):{}); if(m) opts.push(m); }
    if(n===2&&tw==="question") usable.filter(m=>m.f.q).forEach(m=>opts.push(colon("wonder",m)));
    if(n===3) usable.filter(m=>m.f.sound&&!m.f.q).slice(0,40).forEach(m=>opts.push(colon("hear",m)));
    if(n===4&&!["color","number"].includes(tw)) usable.filter(m=>!m.f.q&&!m.f.sound).forEach(m=>opts.push(colon("see",m)));
    if(n===4&&["color","number"].includes(tw)) usable.filter(m=>!m.f.q&&m.f[tw]).forEach(m=>opts.push(colon("see",m)));
    let list=opts.filter(Boolean);
    if(devLine&&LINE_DEVICES.has(dev)){ const d=list.filter(m=>hasDevice(m,dev)); if(d.length) list=d; }
    return list.length?wpick(list):null;
  };
  let best=null;
  const MOD={color:4,number:4,question:2,simile:5,you:5,sound:1,caps:3,order:4,senses:3,bigword:1}[tw];
  const PAIRS_IAM=[[4,5],[3,4],[2,3]].filter(p=>!p.includes(MOD));
  const VERB={2:"wonder",3:"hear",4:"see",5:"remember"};
  for(let a=0;a<300;a++){
    const dl=2+Math.floor(Math.random()*3); const lines=[]; let fail=false;
    const rp=rnd(PAIRS_IAM);
    for(let n=1;n<=5;n++){
      let m=null;
      if(dev==="meter"&&n===3) m=meterLine();
      else if(dev==="slantrhyme"&&n===rp[1]&&lines[rp[0]-1]){ const A=lines[rp[0]-1];
        for(let k=0;k<60&&!m;k++){ const t=mk(n); if(t&&slantWords(A.last,t.last)) m=t; }
        if(!m){ const alt=usable.filter(o=>slantWords(A.last,o.last)&&!o.f.q); if(alt.length) m=colon(VERB[n],rnd(alt)); } }
      else if(dev==="endrhyme"&&n===rp[1]&&lines[rp[0]-1]){ const A=lines[rp[0]-1];
        for(let k=0;k<40&&!m;k++){ const t=mk(n,{endKey:A.rk,endNot:A.lastL}); if(t&&t.rk===A.rk&&t.lastL!==A.lastL) m=t; }
        if(!m){ const alt=usable.filter(o=>o.rk===A.rk&&o.lastL!==A.lastL&&!o.f.q); if(alt.length) m=colon(VERB[n],rnd(alt)); } }
      else m=lineFor(n,n===dl);
      if(!m){ fail=true; break; }
      lines.push(m);
    }
    if(fail) continue;
    lines.push(tw==="shortest"?meta(fixText(`${P} ${BE} the ${rnd(ctx.L.nouns).word}`),"gen",null,ctx):lines[0]);
    if(new Set(lines.slice(0,5).map(l=>l.display)).size<5) continue;
    if(!poemHasDevice(lines,dev)||!poemHasTwist(lines,tw)) continue;
    const sc=scorePoem(lines); if(!best||sc>best.sc) best={lines,sc};
    if(a>60&&best) break;
  }
  if(!best) return null;
  return {lines:best.lines,pairs:[],specs:best.lines.map(()=>({})),form:"iam",dev,tw,theme:ctx.key};
}

/* ===================== STATE ===================== */
const KEY="hauntedquill-v1";
const defaults=()=>({bp:null,bpLines:{},bpOrder:{},refl:{elems:{}},theme:"abbey",device:"repetition",form:"ballad",twist:0,locks:{},step:1,poem:"",title:"",name:"",labels:[{dev:"",line:"",words:""},{dev:"",line:"",words:""},{dev:"",line:"",words:""}],stressOv:{},meterLine:"",meterShow:false,big:false,roomy:false,bankTab:"nouns",visited:{1:true}});
let state=defaults();
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) state=Object.assign(defaults(),s);}catch(e){}
if(!DEVICE_ORDER.includes(state.device)) state.device="slantrhyme";
if(!(state.twist>=0&&state.twist<TWISTS.length)) state.twist=0;
if(!state.beat) state.beat={};
if(!THEMES[state.theme]) state.theme="abbey";
if(!state.refl||typeof state.refl!=="object") state.refl={elems:{}}; if(!state.refl.elems) state.refl.elems={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=()=>THEMES[state.theme];
const C=()=>ctxFor(state.theme);
const words=(key)=>C().L[key].map(e=>e.word);
const DEV_CLS={slantrhyme:"hl-slant",alliteration:"hl-allit",assonance:"hl-asson",consonance:"hl-cons",onomatopoeia:"hl-ono",endrhyme:"hl-rhyme",internalrhyme:"hl-rhyme",repetition:"hl-rep",meter:"hl-meter"};

/* ===================== DEVICE CARDS (all examples drawn from the current theme) ===================== */
function alliterPair(ctx){
  const by={};
  ["adjs","nouns","verbs"].forEach(pos=>ctx.L[pos].forEach(e=>{(by[e.start]=by[e.start]||{adjs:[],nouns:[],verbs:[]})[pos].push(e.word);}));
  const ks=Object.keys(by).filter(k=>by[k].adjs.length&&by[k].nouns.length);
  const k=pick(ks), g=by[k];
  return {k,phrase:[pick(g.adjs),pick(g.nouns)].concat(g.verbs.length?[verbS(pick(g.verbs))]:[])};
}
function hlWords(sentence,ws,cls){
  const set=new Set(ws.map(w=>w.toLowerCase()));
  return esc(sentence).replace(/[A-Za-z']+/g,w=>set.has(w.toLowerCase())?`<span class="hl ${cls}">${w}</span>`:w);
}
function lineWithDevice(m,dev){
  if(dev==="meter") return scanStatic(m);
  const f=m.found.filter(x=>x.dev===dev); const ws=f.flatMap(x=>x.words.flatMap(w=>w.split(" ")));
  return hlWords(m.display,ws,DEV_CLS[dev]);
}
function noteFor(m,dev){ return m.found.filter(x=>x.dev===dev).map(x=>x.note).join(" and the "); }
function poolWith(dev,n){ const l=C().pool.filter(m=>hasDevice(m,dev)&&!m.f.q); const out=[]; const c=l.slice(); while(out.length<n&&c.length) out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); return out; }
function genWith(dev){ const r=genLines(C(),{min:4,max:8,device:dev},1); return r[0]; }
function scanStatic(m){
  const syls=m.stress?(isNotation(m.src)?m.src.trim().split(/\s+/).map(t=>t.split("-").length):m.toks.map(t=>wordInfo(t).syl)):m.toks.map(t=>wordInfo(t).syl);
  let k=0; const st=m.stress||m.toks.flatMap(t=>wordInfo(t).stress);
  return `<span class="scan">${m.toks.map((t,i)=>{ const n=syls[i]||1; const mk=st.slice(k,k+n); k+=n; return `<span class="w"><span class="marks">${mk.map(x=>`<span class="mk ${x?"s":""}">${x?"/":"˘"}</span>`).join("")}</span><span class="wl">${esc(t)}</span></span>`; }).join("")}</span>`;
}
function deviceCard(dev){
  const ctx=C(), t=T();
  const n1=pick(words("nouns")), n2=pick(words("nouns")), a1=pick(words("adjs")), v1=pick(words("verbs")), f1=pick(words("feelings"));
  const r=pick(t.rhymes), as=pick(t.asson), cs=pick(t.cons);
  const fromPool=(d,why)=>{ const m=poolWith(d,1)[0]||genWith(d); return m?{say:lineWithDevice(m,d),why:why(m)}:null; };
  switch(dev){
    case "alliteration":{ const p=alliterPair(ctx); const line=`the ${p.phrase.join(" ")}`;
      return {def:"Repeating the same <b>first sound</b> in words that sit close together.",listen:"Read the line out loud. Listen only to the start of each word.",
        ex:[{say:hlWords(line,p.phrase,"hl-allit"),why:`Every highlighted word starts with the “${p.k}” sound.`},fromPool("alliteration",m=>`The ${noteFor(m,"alliteration")} repeat. It's the sound that counts, not the letter.`)].filter(Boolean),
        starters:[`The ${p.phrase[0]} ${p.phrase[1]} ___ (add a word that starts with “${p.k}”)`,`___ ${n1}, ___ ___, and ___ (make 3 words start with “${startKey(n1)}”)`]};}
    case "assonance":{ const w=as.words.slice(0,4);
      return {def:"Repeating the same <b>vowel sound</b> inside nearby words. The words don't have to rhyme.",listen:"Stretch the middle of each word. Do you hear the same vowel?",
        ex:[{say:hlWords(w.join(", "),w,"hl-asson"),why:`All of these share the ${as.label} sound.`},fromPool("assonance",m=>"Spread across one line, the vowel sound ties the words together.")].filter(Boolean),
        starters:[`Use 3 words with the ${as.label} sound: ${as.words.join(", ")} …`,`The ${w[0]} ___ the ${w[1]} ___`]};}
    case "consonance":{ const w=cs.words;
      return {def:"Repeating a <b>consonant sound</b> in the middle or at the end of nearby words.",listen:"Listen to how the words end. Alliteration is the start; consonance is everywhere else.",
        ex:[{say:hlWords(w.join(", "),w,"hl-cons"),why:`The “${cs.label}” sound shows up inside or at the end of each word.`},fromPool("consonance",m=>`The ${noteFor(m,"consonance")}.`)].filter(Boolean),
        starters:[`Pick 3 words with the “${cs.label}” sound: ${w.join(", ")} → ___`,`The ${a1} ___ ___ (end two words with the same sound)`]};}
    case "onomatopoeia":{ const ss=words("sounds");
      return {def:"A word that <b>sounds like the noise</b> it names.",listen:"Say it out loud. Could someone with their eyes closed guess what's happening?",
        ex:[fromPool("onomatopoeia",m=>"The highlighted word imitates the actual sound."),{say:hlWords(ss.slice(0,5).join(", "),ss,"hl-ono"),why:`Sound words from the ${t.name.toLowerCase()} word bank.`}].filter(Boolean),
        starters:[`${cap(ss[0])}! The ${n1} ___`,`I hear the ___ of the ${n2}: ___, ___`]};}
    case "endrhyme":{
      const pairs=[]; ctx.pool.forEach((a,i)=>ctx.pool.forEach((b,j)=>{ if(j===i+1&&a.rk===b.rk&&a.lastL!==b.lastL&&!a.f.q&&!b.f.q) pairs.push([a,b]); }));
      const pr=pick(pairs);
      return {def:"Words at the <b>ends of lines</b> that share their last sound.",listen:"Cover everything except the last word of each line. Do pairs match?",
        ex:[pr?{say:hlWords(pr[0].display,[pr[0].last],"hl-rhyme")+"<br>"+hlWords(pr[1].display,[pr[1].last],"hl-rhyme"),why:`“${pr[0].lastL}” and “${pr[1].lastL}” match from the vowel to the end.`}:null,{say:hlWords(r.join(" · "),r,"hl-rhyme"),why:"A rhyme family to borrow from."}].filter(Boolean),
        starters:[`Line 1 ends with “${r[0]}”. Line 2 ends with “${r[2]}”.`,`___ ___ ${r[1]} / ___ ___ ${r[3]}`]};}
    case "internalrhyme":{
      const ls=poolWith("internalrhyme",2);
      return {def:"Two rhyming words <b>inside the same line</b>, not just at the end.",listen:"Read the line once. Do you hear a rhyme before you reach the end?",
        ex:ls.map((m,i)=>({say:lineWithDevice(m,"internalrhyme"),why:i?"Short lines make internal rhyme easy to hear.":"The rhyme happens in the middle, which speeds the line up."})),
        starters:[`The ${r[0]} and the ${r[1]} ___`,`___ the ${r[2]}, ___ the ${r[3]}`]};}
    case "repetition":{
      const groups={}; ctx.pool.forEach(m=>{ const k=startKeyLine(m); if(k.split(" ").length>=1&&!m.f.q)(groups[k]=groups[k]||[]).push(m); });
      const g=Object.entries(groups).filter(([k,v])=>v.length>=3&&!["the","a"].includes(k.split(" ")[0])).sort((a,b)=>b[1].length-a[1].length)[0];
      const ana=g?g[1].slice(0,3):[];
      const s1=pick(words("sounds"));
      return {def:"Repeating a <b>word or phrase</b> on purpose. Repeating the start of lines is called <b>anaphora</b>.",listen:"Which words come back? What do they make you notice?",
        ex:[ana.length?{say:ana.map(m=>hlWords(m.display,g[0].split(" "),"hl-rep")).join("<br>"),why:`“${g[0]}” starts every line. That's anaphora.`}:null,{say:hlWords(`${s1}, ${s1}, the ${n1} ${verbS(v1)}`,[s1],"hl-rep"),why:"Repeating one word creates a beat."}].filter(Boolean),
        starters:[`Start 3 lines with “${g?cap(g[0]):"Because the "+n1}…”`,`Pick one word: ${f1}. Use it 3 times.`]};}
    case "slantrhyme":{
      const mono=ctx.L.adjs.concat(ctx.L.nouns,ctx.L.verbs).map(e=>e.word).filter(w=>wordInfo(w).syl===1);
      const pairs=(test)=>{ const out=[]; for(let a=0;a<mono.length;a++) for(let b=a+1;b<mono.length;b++){ if(test(mono[a],mono[b])) out.push([mono[a],mono[b]]); } return out; };
      const es=w=>endSound(w);
      const vp=pick(pairs((a,b)=>slantWords(a,b)&&es(a).v===es(b).v));
      const cp=pick(pairs((a,b)=>slantWords(a,b)&&es(a).v!==es(b).v));
      const lp=[]; ctx.pool.forEach((a,i)=>ctx.pool.forEach((b,j)=>{ if(j>i&&!a.f.q&&!b.f.q&&slantWords(a.last,b.last)) lp.push([a,b]); }));
      const pl=pick(lp);
      return {def:"Line endings that <b>almost</b> rhyme. The vowel matches but the ending doesn't, or the ending matches but the vowel doesn't. Also called near rhyme.",listen:"Say both words. Close, but not a perfect match? That's a slant rhyme.",
        ex:[pl?{say:hlWords(pl[0].display,[pl[0].last],"hl-slant")+"<br>"+hlWords(pl[1].display,[pl[1].last],"hl-slant"),why:`“${pl[0].lastL}” and “${pl[1].lastL}” almost rhyme.`}:null,

function reflOut(){
  const r=state.refl, L=poemLines(); const q=(n)=>"\n"+QTEXT[n]+"\n"; const ln=(i)=>i&&L[i-1]?`line ${i}: "${L[i-1]}"`:"";
  let s="\n— — — GOTHIC QUESTIONS — — —\n";
  const el=ELEMENTS.filter(e=>(r.elems||{})[e.k]);
  s+=q("q1")+(el.length?el.map(e=>`- ${e.t}: ${ln(+r.elems[e.k].line)||"(no line picked)"}${r.elems[e.k].ex?" (example given)":""}`).join("\n"):"(not answered)")+"\n";
  s+=q("q2")+(r.monster?`${MONSTER.find(m=>m.k===r.monster).t}. ${ln(+r.monsterLine)}\n${(r.monsterWhy||"").trim()||"(no sentence written)"}`:"(not answered)")+"\n";
  s+=q("q3")+(r.speaker?`Speaker: ${r.speaker}.\n${(r.trust||"").trim()||"(no sentence written)"}`:"(not answered)")+"\n";
  s+=q("q4")+(r.feel?`Feels like: ${r.feel}.\n${(r.feelWhy||"").trim()||"(no sentence written)"}`:"(not answered)")+"\n";
  s+=q("q5")+(r.src?`Borrowed from: ${r.src}.\n${(r.changed||"").trim()||"(no sentence written)"}`:"(not answered)")+"\n";
  return s; }
function copyRich(txt,msg){
  const ok=()=>{msg.innerHTML='<span class="copied">Copied. Paste it into the assignment as a Text Submission.</span>';};
  const last=()=>{ let ta=document.getElementById("copyfb"); if(!ta){ ta=document.createElement("textarea"); ta.id="copyfb"; ta.rows=8; ta.className="rbox"; msg.parentElement.after(ta);} ta.value=txt; ta.focus(); ta.select();
    let done=false; try{ done=document.execCommand("copy"); }catch(e){} msg.innerHTML=done?'<span class="copied">Copied. Paste it into the assignment as a Text Submission.</span>':'<span class="hint">Click in the box below, press Ctrl+A, then Ctrl+C.</span>'; };
  const plain=()=>{ try{ navigator.clipboard.writeText(txt).then(ok,last); }catch(e){ last(); } };
  try{ const html="<div>"+esc(txt).replace(/^(Q\d\..*)$/gm,"<b>$1</b>").replace(/\n/g,"<br>")+"</div>";
    navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]).then(ok,plain);
  }catch(e){ plain(); }
}

function checkerHTML(){

    const tags=l.found.map(x=>`<span class="dtag ${x.cls}" title="${esc(x.note)}">${esc(x.label)}: ${esc(x.words.join(", "))}</span>`).join("");
    let acro=""; if(state.form==="acrostic"){const want=T().acrostic[i]; if(want) acro=` <span class="cnt ${l.text.trim()[0]&&l.text.trim()[0].toUpperCase()===want?"ok":"off"}">${want}</span>`;}

}

function suggestions(){
  const lines=analyze(state.poem); const out=[];
  lines.forEach((l,i)=>{ if(out.some(o=>o.dev==="repetition")) return; const c={}; l.toks.filter(isContent).forEach(t=>{const k=t.toLowerCase(); c[k]=(c[k]||0)+1;}); const r=Object.entries(c).find(([k,v])=>v>=2); if(r) out.push({dev:"repetition",line:String(i+1),words:Array(r[1]).fill(r[0]).join(", ")}); });
  lines.forEach((l,i)=>l.found.forEach(f=>{ if(!out.some(o=>o.dev===f.dev)) out.push({dev:f.dev,line:String(i+1),words:f.words.join(", ")}); }));
  return out;
}

function checks(){
  const f=FORMS[state.form]; const lines=analyze(state.poem); const n=lines.length;
  const need=state.form==="acrostic"?T().acrostic.length:f.lines;
  const labelled=state.labels.filter(l=>l.dev&&l.line&&l.words.trim()).length;
  const usedDev=state.labels.some(l=>l.dev===state.device&&l.words.trim());
  let sylOk=true; if(f.syl) sylOk=lines.every((l,i)=>!f.syl[i]||l.syl===f.syl[i]);
  return [
    {ok:!!state.title.trim(),t:"Your poem has a title"},
    {ok:f.max?(n>=need&&n<=f.max):(f.min?n>=need:n===need),t:f.max?`${need}–${f.max} lines (you have ${n})`:`${f.min?"At least ":""}${need} lines (you have ${n})`},
    ...(state.form==="ballad"&&state.bp?[{ok:yoursList().length>=4,t:`At least 4 lines are yours (you have ${yoursList().length})`}]:[]),
    ...(f.syl?[{ok:sylOk,t:"Syllable counts match the form (check by clapping)"}]:[]),
    {ok:labelled>=2,t:`At least 2 devices labelled with exact words (you have ${labelled})`},
    {ok:usedDev,t:`One label is your sound device: ${DEVICE_NAMES[state.device]}`},
    ...(state.form==="ballad"?(()=>{const d=qDone(); return [{ok:d.q1,t:"Q1: at least 4 Gothic elements, each with a line"},{ok:d.q2&&!!(state.refl.monsterWhy||"").trim(),t:"Q2: where the monster is, and why"},{ok:d.q3&&!!(state.refl.trust||"").trim(),t:"Q3: the speaker, and whether to trust them"},{ok:d.q4&&!!(state.refl.feelWhy||"").trim(),t:"Q4: what the sound does"},{ok:d.q5&&!!(state.refl.changed||"").trim(),t:"Q5: what you borrowed and changed"}];})():[])
  ];
}
function checklistHTML(){return checks().map(c=>`<li class="${c.ok?"yes":"no"}"><span class="box">${c.ok?"✓":"·"}</span><span>${esc(c.t)}</span></li>`).join("");}
function buildOut(){
  const f=FORMS[state.form]; const lines=state.poem.split("\n").filter(l=>tokens(l).length);
  let s=`${state.title.trim()||"(untitled)"}\n${state.name.trim()?"by "+state.name.trim()+"\n":""}\n${state.poem.trim()||"(your poem goes here)"}\n\n— — —\n${state.form==="ballad"&&state.bp?`Blueprint: ${BP().title} · Form: Gothic Ballad (${lines.length} lines)\nLines I changed or wrote myself: ${yoursList().join(", ")||"none yet"} (${yoursList().length} of ${lines.length})`:`Theme: ${T().name} · Form: ${f.name} · Twist: ${TWISTS[state.twist]}`}\nSound devices I used:\n`;
  const ls=state.labels.filter(l=>l.dev||l.words);
  if(!ls.length) s+="(none labelled yet)\n";
  ls.forEach((l,i)=>{ s+=`${i+1}. ${DEVICE_NAMES[l.dev]||"(device?)"}, line ${l.line||"?"}: "${l.words.trim()||"…"}"\n`; });
  if(state.meterLine){ const idx=parseInt(state.meterLine,10)-1; const line=lines[idx]; if(line){ const sc=scanLine(line); const pat=sc.flatMap(w=>w.marks.map(m=>m.s)); const fit=meterFit(pat); s+=`Meter, line ${idx+1}: ${sc.map(w=>{ /* rebuild with caps on stressed words */ return w.marks.some(m=>m.s)&&w.marks.length===1?w.t.toUpperCase():w.t;}).join(" ")}  →  ${pat.map(p=>p?"/":"˘").join(" ")}${fit?"  ("+fit.label+")":""}\n`; } }
  if(state.form==="ballad") s+=reflOut();
  return s;
}

  document.body.classList.toggle("big",state.big); document.body.classList.toggle("roomy",state.roomy);
  document.getElementById("tgBig").setAttribute("aria-pressed",state.big); document.getElementById("tgRoomy").setAttribute("aria-pressed",state.roomy);
  document.querySelectorAll("nav.steps button").forEach(b=>{const n=+b.dataset.step; b.toggleAttribute("aria-current",false); if(n===state.step) b.setAttribute("aria-current","step"); b.classList.toggle("done",!!state.visited[n]&&n<state.step);});
  view.innerHTML = state.step===1?viewChoose():state.step===2?viewLearn():state.step===3?viewWrite():state.step===4?viewLabel():viewAnswer();
  const tr=document.getElementById("trail"); if(tr) tr.innerHTML=trailHTML();
  if(state.step===4) addMeterPicker();
  if(state.step===2){ if(document.getElementById("exslot")) fillExampleLater(); else requestAnimationFrame(fitExample); }
}
function addMeterPicker(){
  const lines=state.poem.split("\n").filter(l=>tokens(l).length);
  const host=document.getElementById("checklist").parentElement;
  const div=document.createElement("div");
  div.innerHTML=`<label class="label" for="meterLine">Optional: add one line's meter</label><select class="fld" id="meterLine"><option value="">Skip</option>${lines.map((l,i)=>`<option value="${i+1}" ${String(i+1)===state.meterLine?"selected":""}>Line ${i+1}</option>`).join("")}</select><p class="notice">Uses the stresses you marked in Step 3.</p>`;
  host.parentElement.insertBefore(div,host);
}
function refreshOut(){const tr=document.getElementById("trail"); if(tr) tr.innerHTML=trailHTML(); const o=document.getElementById("out"); if(o) o.textContent=buildOut(); const c=document.getElementById("checklist"); if(c) c.innerHTML=checklistHTML();}

/* ===================== EVENTS ===================== */
document.querySelectorAll("nav.steps button").forEach(b=>b.addEventListener("click",()=>setStep(+b.dataset.step)));
document.getElementById("tgBig").onclick=()=>{state.big=!state.big; save(); render();};
document.getElementById("tgRoomy").onclick=()=>{state.roomy=!state.roomy; save(); render();};
let resetArmed=false;
document.getElementById("tgReset").onclick=e=>{ if(!resetArmed){resetArmed=true; e.target.textContent="Tap again to erase"; setTimeout(()=>{resetArmed=false; e.target.textContent="Start over";},3000); return;} const keep={big:state.big,roomy:state.roomy}; state=Object.assign(defaults(),keep); resetArmed=false; e.target.textContent="Start over"; save(); render(); };

function doSpin(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pools={theme:Object.keys(THEMES),device:DEVICE_ORDER,form:Object.keys(FORMS),twist:TWISTS.map((_,i)=>i)};
  const names={theme:k=>THEMES[k].name,device:k=>DEVICE_NAMES[k],form:k=>FORMS[k].name,twist:i=>TWISTS[i]};
  const final={}; Object.keys(pools).forEach(k=>{ if(!state.locks[k]){ let v; do{v=pick(pools[k]);}while(pools[k].length>1&&v===state[k]); final[k]=v; } });
  const finish=()=>{Object.assign(state,final); save(); render();};
  if(reduce) return finish();
  let ticks=0; const iv=setInterval(()=>{ Object.keys(final).forEach(k=>{const el=document.querySelector(`#slot-${k}`); if(el){el.classList.add("rolling"); el.querySelector(".val").textContent=names[k](pick(pools[k]));}}); if(++ticks>9){clearInterval(iv); finish();} },70);
}
view.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="spin") return doSpin();
  if(b.dataset.bp){ chooseBP(b.dataset.bp); return setStep(2); }
  if(b.dataset.bpick){ bpLinesFor(state.bp)[b.dataset.bpick]=b.dataset.text; assemble(); save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.elem){ const E=state.refl.elems; if(E[b.dataset.elem]) delete E[b.dataset.elem]; else E[b.dataset.elem]={line:""}; save(); return render(); }
  if(b.dataset.rq){ state.refl[b.dataset.rq]=b.dataset.v; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.go) return setStep(+b.dataset.go);
  if(b.dataset.lock){state.locks[b.dataset.lock]=!state.locks[b.dataset.lock]; save(); render(); return;}
  if(b.id==="newEx") return render();
  if(b.id==="beatBtn"){ state.beat[state.form]=!beatOn(); save(); return render(); }
  if(b.id==="anotherEx"){ delete EX_CACHE[exKey()]; return render(); }
  if(b.dataset.dev){state.device=b.dataset.dev; save(); render(); return;}
  if(b.dataset.starter!==undefined){const txt=b.parentElement.querySelector("span").textContent; state.poem=(state.poem.trim()?state.poem.replace(/\s*$/,"\n"):"")+txt; save(); setStep(3); return;}
  if(b.dataset.tab){state.bankTab=b.dataset.tab; save(); const pad=document.getElementById("pad"); const pos=pad?pad.selectionStart:null; render(); restoreCursor(pos); return;}
  if(b.dataset.word){insertWord(b.dataset.word); return;}
  if(b.dataset.k){const cur=+b.dataset.s; state.stressOv[b.dataset.k]=cur?0:1; save(); document.getElementById("meter").innerHTML=meterHTML(); return;}
  if(b.id==="autofill"){const sg=suggestions(); let j=0; state.labels=state.labels.map(l=>{ if(l.dev&&l.words.trim()) return l; const s=sg.find((x,ix)=>ix>=j && !state.labels.some(y=>y.dev===x.dev&&y.words.trim())); if(s){j=sg.indexOf(s)+1; return {...s};} return l; }); save(); render(); return;}
  if(b.id==="copy"){copyOut(); return;}
});
function restoreCursor(pos){const pad=document.getElementById("pad"); if(pad&&pos!=null){pad.focus(); pad.setSelectionRange(pos,pos);}}
let lastCursor=null;
document.addEventListener("selectionchange",()=>{const pad=document.getElementById("pad"); if(pad&&document.activeElement===pad) lastCursor=pad.selectionStart;});
let lastField=null;
document.addEventListener("focusin",e=>{ const t=e.target; if(t.id==="pad"||(t.dataset&&t.dataset.bl)) lastField=t.id==="pad"?"pad":t.dataset.bl; });
function insertWord(w){
  const pad=lastField&&lastField!=="pad"?document.querySelector(`[data-bl="${lastField}"]`):document.getElementById("pad"); if(!pad) return;
  const pos=(lastField==="pad"&&lastCursor!=null)?lastCursor:(pad.selectionStart!=null&&document.activeElement===pad?pad.selectionStart:pad.value.length);
  const before=pad.value.slice(0,pos), after=pad.value.slice(pos);
  const pre=(before&&!/[\s\n]$/.test(before))?" ":""; const post=(after&&!/^[\s\n.,!?]/.test(after))?" ":"";
  pad.value=before+pre+w+post+after;
  if(pad.dataset.bl){ bpLinesFor(state.bp)[pad.dataset.bl]=pad.value; const bv=bpVisible(); assemble(); save(); const np=(before+pre+w+post).length; pad.focus(); pad.setSelectionRange(np,np); updateBuilder(pad.dataset.bl,bv); return; }
  state.poem=pad.value; save();
  const np=(before+pre+w+post).length; lastCursor=np; pad.focus(); pad.setSelectionRange(np,np); updateWrite();
}
let tmr=null;
function updateBuilder(id,before){
  if(bpVisible()!==before){ const el=document.querySelector(`[data-bl="${id}"]`); const pos=el?el.selectionStart:null; const y=window.scrollY; render(); window.scrollTo(0,y); const n=document.querySelector(`[data-bl="${id}"]`); if(n){ n.focus(); if(pos!=null) n.setSelectionRange(pos,pos);} return; }
  const mine=yoursList(); const y=document.getElementById("yours"); if(y) y.innerHTML=(mine.length?`<span class="stars" aria-hidden="true">${"✦".repeat(mine.length)}</span> <b>${mine.length}</b> line${mine.length>1?"s are":" is"} yours${mine.length>=4?". That's the goal. Keep going if you want.":"."}`:'<span class="hint">No lines are yours yet. Your first one gets a star.</span>');
  const lc=document.getElementById("lcount"); if(lc) lc.textContent=poemLines().length;
  document.querySelectorAll(".binput").forEach(inp=>{ const [s,j]=inp.dataset.bl.split("-").map(Number); const row=inp.closest(".bline"); const own=inp.value.trim()&&isMine(s,j,inp.value); row.classList.toggle("own",!!own); let m=row.querySelector(".mine"); if(own&&!m){ m=document.createElement("span"); m.className="mine"; m.textContent="✦ yours"; row.querySelector(".bmain").appendChild(m);} if(!own&&m) m.remove(); row.querySelectorAll(".bchip").forEach(c=>c.setAttribute("aria-pressed",norm(c.dataset.text)===norm(inp.value))); });
  const c=document.getElementById("checker"); if(c) c.innerHTML=checkerHTML();
}
function updateWrite(){const c=document.getElementById("checker"); if(c) c.innerHTML=checkerHTML(); const m=document.getElementById("meter"); if(m) m.innerHTML=meterHTML();}
view.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bl){ bpLinesFor(state.bp)[t.dataset.bl]=t.value; const before=bpVisible(); assemble(); save(); clearTimeout(tmr); tmr=setTimeout(()=>updateBuilder(t.dataset.bl,before),350); return; }
  if(t.dataset.rf){ state.refl[t.dataset.rf]=t.value; save(); refreshOut(); return; }
  if(t.id==="pad"){state.poem=t.value; save(); clearTimeout(tmr); tmr=setTimeout(updateWrite,250); return;}
  if(t.id==="title"){state.title=t.value; save(); return;}
  if(t.id==="name"){state.name=t.value; save(); refreshOut(); return;}
  if(t.dataset.lb!==undefined){state.labels[+t.dataset.lb][t.dataset.f]=t.value; save(); refreshOut(); return;}
});
view.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.pick){const k=t.dataset.pick; state[k]=k==="twist"?+t.value:t.value; state.locks[k]=true; save(); render(); return;}
  if(t.dataset.lb!==undefined){state.labels[+t.dataset.lb][t.dataset.f]=t.value; save(); refreshOut(); return;}
  if(t.dataset.elemline){ const e=state.refl.elems[t.dataset.elemline]; if(e){ e.line=t.value; e.ex=false; } save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.rfsel){ state.refl[t.dataset.rfsel]=t.value; save(); refreshOut(); return; }
  if(t.id==="meterLine"){state.meterLine=t.value; save(); refreshOut(); return;}
});
view.addEventListener("toggle",e=>{ if(e.target.id==="meterbox"){state.meterShow=e.target.open; save();} },true);
function copyOut(){
  const txt=buildOut(); const msg=document.getElementById("copyMsg"); return copyRich(txt,msg);
  const fallback=()=>{const pre=document.getElementById("out"); const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); msg.innerHTML='<span class="hint">Text selected. Press Ctrl+C (or ⌘C) to copy.</span>';};
  try{ navigator.clipboard.writeText(txt).then(()=>{msg.innerHTML='<span class="copied">Copied. Paste it into your assignment.</span>';},fallback); }catch(err){fallback();}
}
render();
</script>
